name: Theme Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check theme integrations
        run: npm run theme:check-integrations
      - name: Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: "."
          token: ${{ github.token }}
          base: main
