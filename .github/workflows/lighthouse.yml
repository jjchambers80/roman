name: Lighthouse CI

on:
  pull_request:

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse
        uses: shopify/lighthouse-ci-action@v1.4.0
        with:
          store: ${{ secrets.SHOP_STORE }}
          client_id: ${{ secrets.SHOP_CLIENT_ID }}
          client_secret: ${{ secrets.SHOP_CLIENT_SECRET }}
          lhci_github_app_token: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          # Perf budget — fail PR below threshold. Tune as the store improves.
          lhci_min_score_performance: 0.8
          lhci_min_score_accessibility: 0.9
          lhci_min_score_seo: 0.9
