</style></head><body><main class="card"><div class="kicker">Roman Skin / AM layering guide</div><h1 class="title">A simple morning routine</h1><div class="steps"><div class="step"><div class="number">01</div><div class="name">Cleanse</div></div><div class="step"><div class="number">02</div><div class="name">Tone</div></div><div class="step serum"><div class="number">03</div><div class="name">Apply 2–3 drops of serum</div></div><div class="step"><div class="number">04</div><div class="name">Moisturize</div></div><div class="step"><div class="number">05</div><div class="name">Finish with broad-spectrum SPF</div></div></div><p class="note">Allow the serum to absorb before applying the next step. It may also be used in an evening routine.</p></main></body></html>
